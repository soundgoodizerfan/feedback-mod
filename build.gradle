plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Fail the build on a stale or malformed AT entry rather than at runtime.
    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mods we want present in the dev client but never in our jar and never in our
// published dependencies. FML in a dev run does not scan the runtime classpath for
// mods, so putting them on it does nothing -- they have to land in the run's mods
// folder. Sync (not Copy) so removing one here removes it from the folder too.
configurations {
    devMods
}

tasks.register('syncDevMods', Sync) {
    from configurations.devMods
    into file('run/mods')
}

// Client only: JEI and Ponder are both client-side, and a dedicated server refuses them.
tasks.named('runClient') {
    dependsOn 'syncDevMods'
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.1'

    // Flywheel -- shipped, and the only one of these that is.
    // A spinning shaft is the mod's main sensory channel (philosophy 8: the player's own senses
    // are free), and one draw call per shaft is not a price a shaft run can pay. The API is
    // compileOnly because nothing on a dedicated server may touch it; the implementation is
    // jarJar'd so a player never has to install it by hand. It arrives in the dev run through
    // Ponder's devMods entry, which is why this was easy to forget to declare.
    compileOnlyApi "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    jarJar(runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") {
        version {
            strictly flywheel_version_range
            prefer flywheel_version
        }
    })

    // playerAnimator -- shipped. Plays clips (cleannrooster's emote-format animations) on the player
    // model, third and first person; combat poses that a procedural tweak cannot make. Client
    // classes only, but the jar must load on a server too, so it is jarJar'd rather than devMods.
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}"
    jarJar(runtimeOnly("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}") {
        version {
            strictly player_anim_version_range
            prefer player_anim_version
        }
    })

    // JEI -- development only, never shipped.
    // The API is compileOnly in case we ever write a plugin; the full mod goes in
    // devMods so it actually loads. Feedback's machines have no recipe list to show,
    // and we need to see first-hand what a recipe browser does with that.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    devMods "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // PonderLib -- development only, never shipped (yet).
    // Philosophy 8, "Documentation is a free sense", makes Ponder the designated
    // explanation channel. No scenes exist yet, so this is here to experiment with,
    // not to depend on. Promoting it to a real dependency is a deliberate later step.
    // Also pulls Flywheel in transitively, which is how the dev run gets it; we declare it
    // above in its own right so a shipped jar does not depend on Ponder being present.
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    devMods "net.createmod.ponder:ponder-neoforge:${ponder_version}"

    // Jade -- a written compat plugin now, but still not a shipped dependency.
    // A HUD that prints "1247 Tu" on a bare crucible hands out the thermometer for free and
    // guts philosophy 8. A HUD that says "really hot!!!" until an instrument is installed, and
    // figures afterwards, IS that rule, on a HUD -- so the plugin exists and reports in
    // adjectives.
    // Jade publishes no separate API artifact, so the whole mod is the compile dependency.
    // compileOnly keeps it out of the jar: our plugin class is only ever loaded by Jade's own
    // annotation scan, so nothing touches those classes when Jade is absent.
    compileOnly "maven.modrinth:jade:${jade_version}"
    devMods "maven.modrinth:jade:${jade_version}"

    // Better Combat -- a required mod (all rights reserved: never jarJar'd, never copied; players install it).
    // We use its animation player, upswing gearing, and sounds; its attack rules are not ours.
    compileOnly "maven.modrinth:better-combat:${better_combat_version}"
    devMods "maven.modrinth:better-combat:${better_combat_version}"
    devMods "maven.modrinth:cloth-config:${cloth_config_version}"

    // spark -- development only, never shipped. A profiler, for "something here is laggy":
    // /sparkc profiler start, play the slow thing, /sparkc profiler stop.
    devMods "maven.modrinth:spark:${spark_version}"

    // MmmMmmMmmMmm (Target Dummy) -- development only, never shipped. Damage-number dummy for
    // combat testing; matches the test pack. Needs Moonlight Lib.
    // Modrinth version ids, not numbers: the number is shared with the Fabric build and resolves to it.
    devMods "maven.modrinth:mmmmmmmmmmmm:${dummy_version}"
    devMods "maven.modrinth:moonlight:${moonlight_version}"

    // Curios -- a required dependency, not shipped. Gloves are a curio in its `hands` slot, so a
    // player's protection from a hot piece is something worn rather than a held-item special case.
    // Modrinth's maven carries the whole mod, API included.
    implementation "maven.modrinth:curios:${curios_version}"

    // Sable -- a required dependency, not shipped. Arbitrary physics bodies for vehicles
    // (docs/specs/feedback_vehicles_spec.md); PolyForm Shield, covered by the GPL section 7 exception in
    // LICENSING.md. Its optional Create support is excluded; Flywheel and Ponder are declared
    // above in their own right.
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: "com.simibubi.create"
        exclude group: "net.createmod.ponder"
        exclude group: "dev.engine-room.flywheel"
        exclude group: "com.tterrag.registrate"
    }
}

// neoforge.mods.toml needs the version numbers that only gradle.properties knows.
tasks.named('processResources', ProcessResources).configure {
    def props = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            flywheel_version_range : flywheel_version_range,
            curios_version_range   : curios_version_range,
            better_combat_version_range: better_combat_version_range,
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    withSourcesJar()
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors,
    ])
}

repositories {
    mavenLocal()
    maven {
        name = 'BlameJared'          // JEI, Veil (Sable's base)
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'CreateMod'           // PonderLib, Catnip, Flywheel
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'Fuzss'               // NeoForge Config API port, a Ponder runtime dep
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'RyanHCode'   // Sable
                url = 'https://maven.ryanhcode.dev/releases'
            }
        }
        filter {
            includeGroup 'dev.ryanhcode.sable'
            includeGroup 'dev.ryanhcode.sable-companion'
        }
    }
    maven {
        name = 'KosmX'               // playerAnimator
        url = 'https://maven.kosmx.dev/'
    }
    maven {
        name = 'Modrinth'            // Jade
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
