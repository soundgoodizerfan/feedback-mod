modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
credits = "Placeholder textures by Malcolm Riley (unused-textures, CC BY 4.0)"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Rendering only, so the dedicated server neither needs it nor loads it. Required rather than
# optional on the client: without instancing a shaft run does not turn, and a factory that looks
# identical running and stopped is the one thing philosophy 8 cannot survive.
[[dependencies.${mod_id}]]
modId = "flywheel"
type = "required"
versionRange = "${flywheel_version_range}"
ordering = "AFTER"
side = "CLIENT"

# Vehicles are Sable physics bodies (feedback_vehicles_spec.md). Required on both sides: the
# body is simulated on the server and rendered on the client.
[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "[2.0.6,)"
ordering = "AFTER"
side = "BOTH"

# Gloves (item/GloveItem) are a curio in the `hands` slot. Required on both sides: protection is
# decided on the server from what the player wears.
[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "${curios_version_range}"
ordering = "AFTER"
side = "BOTH"
